name: bakasub

services:
  postgres:
    image: postgres:17-alpine
    container_name: bakasub_postgres
    environment:
      POSTGRES_DB: bakasub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bakasub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in release.env}
    container_name: bakasub_backend
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bakasub?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./library:/videos
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE in release.env}
    container_name: bakasub_frontend
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    depends_on:
      - backend
    ports:
      - "80"
    restart: unless-stopped

volumes:
  postgres_data: